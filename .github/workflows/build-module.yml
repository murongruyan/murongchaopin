name: Build Module Package

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "module.prop 中的新版本号，例如 2.9.10"
        required: false
        default: "2.9.10"
        type: string
      version_code:
        description: "module.prop 中的新 versionCode，例如 39"
        required: false
        default: "39"
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: murong-display-enhancement
      RELEASE_NAME: 慕容显示增强
      NDK_PACKAGE: "30.0.14904198"
      API_LEVEL: "29"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            # 输入为空时回退到 module.prop 中的值，保证"直接 Run workflow"也能用默认值执行
            version="${{ github.event.inputs.version }}"
            version_code="${{ github.event.inputs.version_code }}"
            if [[ -z "$version" ]]; then
              version="$(grep '^version=' module.prop | cut -d'=' -f2-)"
            fi
            if [[ -z "$version_code" ]]; then
              version_code="$(grep '^versionCode=' module.prop | cut -d'=' -f2-)"
            fi
            release_tag="${RELEASE_TAG}"
            release_name="${RELEASE_NAME}"

            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
            echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
            echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
            echo "target_branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            version="$(grep '^version=' module.prop | cut -d'=' -f2-)"
            version_code="$(grep '^versionCode=' module.prop | cut -d'=' -f2-)"

            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "release_name=" >> "$GITHUB_OUTPUT"
            echo "target_branch=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi
          echo "ZIP_NAME=Murong.Display.Enhancement-v${version}.zip" >> "$GITHUB_ENV"

      - name: Update version files
        if: steps.release_meta.outputs.is_release == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release_meta.outputs.version }}
          VERSION_CODE: ${{ steps.release_meta.outputs.version_code }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
          TARGET_BRANCH: ${{ steps.release_meta.outputs.target_branch }}
          REPOSITORY: ${{ github.repository }}
          ZIP_NAME: ${{ env.ZIP_NAME }}
        run: |
          set -euo pipefail

          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          version_code = os.environ["VERSION_CODE"]
          release_tag = os.environ["RELEASE_TAG"]
          target_branch = os.environ["TARGET_BRANCH"]
          repository = os.environ["REPOSITORY"]
          zip_name = os.environ["ZIP_NAME"]

          module_prop = Path("module.prop")
          lines = module_prop.read_text(encoding="utf-8").splitlines()
          updated_lines = []
          update_json_url = f"https://raw.githubusercontent.com/{repository}/{target_branch}/update.json"

          for line in lines:
            if line.startswith("version="):
              updated_lines.append(f"version={version}")
            elif line.startswith("versionCode="):
              updated_lines.append(f"versionCode={version_code}")
            elif line.startswith("updateJson="):
              updated_lines.append(f"updateJson={update_json_url}")
            else:
              updated_lines.append(line)

          module_prop.write_text("\n".join(updated_lines) + "\n", encoding="utf-8")

          update_json_path = Path("update.json")
          data = json.loads(update_json_path.read_text(encoding="utf-8"))
          data["version"] = version
          data["versionCode"] = int(version_code)
          data["zipUrl"] = f"https://github.com/{repository}/releases/download/{release_tag}/{zip_name}"
          data["changelog"] = f"https://raw.githubusercontent.com/{repository}/{target_branch}/changelog.md"
          update_json_path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up JDK 26 for Hook APK build
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle

      - name: Install Android NDK and SDK 37
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --channel=1 --install "ndk;${NDK_PACKAGE}"
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Build native binaries
        shell: bash
        run: |
          set -euo pipefail

          ANDROID_NDK_HOME="${ANDROID_SDK_ROOT}/ndk/${NDK_PACKAGE}"
          TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="$TOOLCHAIN/sysroot"
          TARGET="aarch64-linux-android${API_LEVEL}"
          CLANG="$TOOLCHAIN/bin/${TARGET}-clang"
          OUT_DIR="build/bin"

          echo "Using NDK from: $ANDROID_NDK_HOME"
          echo "Using clang: $CLANG"
          "$CLANG" --version

          mkdir -p "$OUT_DIR"

          for source in process_dts dts_tool pack_dtbo unpack_dtbo; do
            echo "Building $source"
            "$CLANG" \
              --sysroot="$SYSROOT" \
              -Wall \
              -O3 \
              -fPIE \
              -pie \
              -lc \
              -lm \
              -o "$OUT_DIR/$source" \
              "src/$source.c"
          done

      - name: Validate scripts and Web backup isolation
        shell: bash
        run: |
          set -euo pipefail
          for script in \
            customize.sh \
            uninstall.sh \
            post-fs-data.sh \
            post-mount.sh \
            late-load.sh \
            scripts/dtbo_avb.sh \
            scripts/display_backend.sh \
            scripts/hmbird_backend.sh \
            scripts/coloros_config.sh \
            scripts/display_license_gate.sh \
            scripts/surfaceflinger_ltps_vote_patch.sh \
            scripts/web_handler.sh \
            tests/device_stock_backup_guard.sh \
            tests/device_invalid_backup_refusal.sh \
            tests/check_web_stock_isolation.sh \
            tests/check_backend_dispatch.sh \
            tests/check_dtbo_apply_lock.sh \
            tests/check_install_tool_permissions.sh \
            tests/check_volume_key_parser.sh \
            tests/check_module_update_preservation.sh; do
            sh -n "$script"
          done
          sh tests/check_drm_ko_profiles.sh
          sh tests/check_pjd110_drm_ko.sh
          sh tests/check_pjd110_ko_support_dtbo.sh
          sh tests/check_hmbird_backend.sh
          sh tests/check_hmbird_dtbo_only.sh
          sh tests/check_low_refresh_preservation.sh
          sh tests/check_rmx5200_adfr_dry_run.sh
          sh tests/check_refresh_rate_warning.sh
          sh tests/check_paid_webui.sh
          sh tests/check_webui_performance.sh
          sh tests/check_webui_auth_flow.sh
          sh tests/check_server_update_contract.sh
          sh tests/check_ksu_predictive_back.sh
          node --check webroot/js/main.js
          sh tests/check_web_stock_isolation.sh
          sh tests/check_backend_dispatch.sh
          sh tests/check_dtbo_apply_lock.sh
          sh tests/check_mode_index_integrity.sh
          sh tests/check_install_tool_permissions.sh
          sh tests/check_volume_key_parser.sh
          sh tests/check_module_update_preservation.sh
          sh tests/check_surfaceflinger_ltps_vote_patch.sh
          sh tests/check_premium_script_line_endings.sh

      - name: Configure Hook signing
        id: hook_signing
        shell: bash
        env:
          KS_B64: ${{ secrets.MURONG_HOOK_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.MURONG_HOOK_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MURONG_HOOK_KEY_ALIAS }}
          KEY_PW: ${{ secrets.MURONG_HOOK_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > src/settings_hook/release.jks
            echo "MURONG_HOOK_KEYSTORE=${PWD}/src/settings_hook/release.jks" >> "$GITHUB_ENV"
            echo "MURONG_HOOK_STORE_PASSWORD=${STORE_PW}" >> "$GITHUB_ENV"
            echo "MURONG_HOOK_KEY_ALIAS=${KEY_ALIAS}" >> "$GITHUB_ENV"
            echo "MURONG_HOOK_KEY_PASSWORD=${KEY_PW}" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build free Hook APK
        shell: bash
        run: |
          set -euo pipefail
          cd src/settings_hook
          chmod +x gradlew
          ./gradlew exportFreeApk --no-daemon

      - name: Sign free Hook APK with v1-v4
        if: steps.hook_signing.outputs.signed == 'true'
        shell: pwsh
        run: ./scripts/sign_hook_apk.ps1 -ApkPath bin/display_settings_hook.apk -KeystorePath $env:MURONG_HOOK_KEYSTORE -KeyAlias $env:MURONG_HOOK_KEY_ALIAS

      - name: Require Hook signing for release
        if: steps.release_meta.outputs.is_release == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.hook_signing.outputs.signed }}" != "true" ]; then
            echo "Release requires MURONG_HOOK_KEYSTORE_BASE64 / MURONG_HOOK_STORE_PASSWORD / MURONG_HOOK_KEY_ALIAS / MURONG_HOOK_KEY_PASSWORD secrets" >&2
            exit 1
          fi

      - name: Verify Hook v1-v4 signatures
        if: steps.hook_signing.outputs.signed == 'true'
        shell: pwsh
        run: ./scripts/sign_hook_apk.ps1 -ApkPath bin/display_settings_hook.apk -VerifyOnly

      - name: Read module metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          module_id="$(grep '^id=' module.prop | cut -d'=' -f2-)"
          version="$(grep '^version=' module.prop | cut -d'=' -f2-)"
          version_code="$(grep '^versionCode=' module.prop | cut -d'=' -f2-)"

          echo "module_id=$module_id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "artifact_name=${module_id}-v${version}-${version_code}" >> "$GITHUB_OUTPUT"
          echo "release_body_tag=${{ steps.release_meta.outputs.release_tag }}" >> "$GITHUB_OUTPUT"

      - name: Assemble module package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          STAGE_DIR="build/package"
          ZIP_PATH="build/${ZIP_NAME}"
          CHECKSUM_PATH="${ZIP_PATH}.sha256"

          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"

          required_paths=(
            "bin"
            "config"
            "META-INF"
            "scripts"
            "webroot"
            "action.sh"
            "customize.sh"
            "module.prop"
            "KsuWebUI.apk"
            "service.sh"
            "post-fs-data.sh"
            "post-mount.sh"
            "late-load.sh"
            "uninstall.sh"
          )

          for path in "${required_paths[@]}"; do
            if [ ! -e "$path" ]; then
              echo "Missing required path: $path" >&2
              exit 1
            fi
            cp -a "$path" "$STAGE_DIR/"
          done

          mkdir -p "$STAGE_DIR/img"
          if [ -d "img" ]; then
            cp -a img/. "$STAGE_DIR/img/"
          fi

          # 这是唯一的公开模块安装包。授权增强组件只能由模块在设备上
          # 经签名校验后下载，严禁进入 GitHub Release。
          premium_bin_patterns=(
            "rmx5200_ltpo_modes.ko"
            "rmx5200_ltpo_activity.ko"
            "surfaceflinger.rmx5200.ltpo-oti"
            "surfaceflinger.rmx5200.ltpo-rise"
            "rmx5200_adfr_lock.ko"
            "pjd110_adfr_lock.ko"
            "libpwirisservicei7p.rmx5200.memc-gate.so"
            "libsdmclient.rmx5200.ltpo-timeline.so"
            "ltpo.ko"
            "hmbird.ko"
            "*_probe.ko"
            "*qhd144*"
            "*_test"
            "*.new"
            "*.drop-fhd-test"
            "*.pjd-index-test"
            "*.plk-index-test"
          )
          premium_script_names=(
            "adfr_lock.sh"
            "generic_adfr_policy.sh"
            "surfaceflinger_vote_patch.sh"
            "surfaceflinger_ltpo_rise_patch.sh"
            "libsdmclient_timeline_patch.sh"
            "rmx5200_ltpo_experiment.sh"
            "rmx5200_ltpo_activity.sh"
            "libpwiris_memc_gate_patch.sh"
            "rmx5200_native_adfr.sh"
          )
          premium_config_names=(
            "rmx5200_adfr_profile.txt"
            "rmx5200_adfr_commands.dtsi"
            "iris_page_i7p.stock.sha256"
            "rmx5200_ltpo_modes.sha256"
            "rmx5200_ltpo_activity.sha256"
            "ltpo.ko.sha256"
            "multimedia_pixelworks_apps.xml"
          )

          for pattern in "${premium_bin_patterns[@]}"; do
            find "$STAGE_DIR/bin" -name "$pattern" -delete 2>/dev/null || true
          done
          for name in "${premium_script_names[@]}"; do
            rm -f "$STAGE_DIR/scripts/$name" "$STAGE_DIR/$name"
          done
          for name in "${premium_config_names[@]}"; do
            rm -f "$STAGE_DIR/config/$name" "$STAGE_DIR/config/coloros/$name"
          done
          # 系统目录中的 Pixelworks overlay 属付费 MEMC（本工作流本就不打包
          # system/，此处防御性断言）。
          rm -rf "$STAGE_DIR/system"

          # 付费组件泄漏断言：任何遗漏都直接失败
          leak_failures=0
          for probe in \
            rmx5200_ltpo_modes.ko rmx5200_adfr_lock.ko ltpo.ko \
            libpwirisservicei7p.rmx5200.memc-gate.so surfaceflinger.rmx5200.ltpo-rise \
            libpwiris_memc_gate_patch.sh rmx5200_ltpo_experiment.sh adfr_lock.sh \
            surfaceflinger_vote_patch.sh iris_page_i7p.json multimedia_pixelworks_apps.xml; do
            if find "$STAGE_DIR" -name "$probe" -print -quit 2>/dev/null | grep -q .; then
              echo "Private runtime component leaked into public module: $probe" >&2
              leak_failures=$((leak_failures + 1))
            fi
          done
          if [ "$leak_failures" -gt 0 ]; then
            echo "Public module leak check failed: $leak_failures private components found" >&2
            exit 1
          fi
          echo "Public module leak check passed"

          # Hook 类级泄漏检查：免费 Hook APK 的 dex 中不得出现付费/研究类名
          HOOK_APK="$STAGE_DIR/bin/display_settings_hook.apk"
          HOOK_IDSIG="${HOOK_APK}.idsig"
          if [ -f "$HOOK_APK" ]; then
            for probe in NotificationLtpoHooks VideoMotion ColorosVideoPlayback BilibiliStory; do
              if unzip -p "$HOOK_APK" 'classes*.dex' 2>/dev/null | strings | grep -q "$probe"; then
                echo "Licensed hook class leaked into public Hook APK: $probe" >&2
                exit 1
              fi
            done
            echo "Public Hook APK class leak check passed"
          fi
          if [ "${{ steps.release_meta.outputs.is_release }}" = 'true' ]; then
            test -s "$HOOK_APK"
            test -s "$HOOK_IDSIG"
          fi

          install -m 0755 build/bin/process_dts "$STAGE_DIR/bin/process_dts"
          install -m 0755 build/bin/dts_tool "$STAGE_DIR/bin/dts_tool"
          install -m 0755 build/bin/pack_dtbo "$STAGE_DIR/bin/pack_dtbo"
          install -m 0755 build/bin/unpack_dtbo "$STAGE_DIR/bin/unpack_dtbo"
          chmod 0755 "$STAGE_DIR/bin/rate_daemon"
          test -x "$STAGE_DIR/bin/rate_daemon"

          chmod 0755 \
            "$STAGE_DIR/action.sh" \
            "$STAGE_DIR/customize.sh" \
            "$STAGE_DIR/service.sh" \
            "$STAGE_DIR/post-fs-data.sh" \
            "$STAGE_DIR/post-mount.sh" \
            "$STAGE_DIR/late-load.sh" \
            "$STAGE_DIR/uninstall.sh" \
            "$STAGE_DIR/scripts/web_handler.sh" \
            "$STAGE_DIR/scripts/dtbo_avb.sh" \
            "$STAGE_DIR/scripts/display_backend.sh" \
            "$STAGE_DIR/scripts/hmbird_backend.sh" \
            "$STAGE_DIR/scripts/mode_manifest.sh" \
            "$STAGE_DIR/scripts/coloros_config.sh" \
            "$STAGE_DIR/scripts/display_license_gate.sh" \
            "$STAGE_DIR/scripts/surfaceflinger_ltps_vote_patch.sh"

          for path in bin config img META-INF scripts webroot action.sh customize.sh module.prop KsuWebUI.apk service.sh post-fs-data.sh post-mount.sh late-load.sh uninstall.sh; do
            if [ ! -e "$STAGE_DIR/$path" ]; then
              echo "Packaged path missing: $path" >&2
              exit 1
            fi
          done

          rm -f "$ZIP_PATH" "$CHECKSUM_PATH"
          (
            cd "$STAGE_DIR"
            zip -rq "../${ZIP_NAME}" .
          )

          sha256sum "$ZIP_PATH" > "$CHECKSUM_PATH"

          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$CHECKSUM_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        if: steps.release_meta.outputs.is_release != 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.zip_path }}
            ${{ steps.package.outputs.checksum_path }}
            bin/display_settings_hook.apk
            bin/display_settings_hook.apk.idsig
          if-no-files-found: error
          retention-days: 1

      - name: Commit version changes
        if: steps.release_meta.outputs.is_release == 'true'
        shell: bash
        env:
          TARGET_BRANCH: ${{ steps.release_meta.outputs.target_branch }}
          RELEASE_TAG: ${{ steps.release_meta.outputs.release_tag }}
          VERSION: ${{ steps.release_meta.outputs.version }}
          VERSION_CODE: ${{ steps.release_meta.outputs.version_code }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add module.prop update.json

          if git diff --cached --quiet; then
            echo "No version file changes detected."
          else
            git commit -m "chore: release v${VERSION} (${VERSION_CODE}) [skip ci]"
            git push origin "HEAD:${TARGET_BRANCH}"
          fi

      - name: Capture release commit
        if: steps.release_meta.outputs.is_release == 'true'
        shell: bash
        run: echo "RELEASE_COMMIT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        if: steps.release_meta.outputs.is_release == 'true'
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifactErrorsFailBuild: true
          artifacts: ${{ steps.package.outputs.zip_path }},${{ steps.package.outputs.checksum_path }}
          commit: ${{ env.RELEASE_COMMIT_SHA }}
          bodyFile: docs/RELEASE_NOTES_v${{ steps.release_meta.outputs.version }}.md
          generateReleaseNotes: false
          makeLatest: true
          name: ${{ steps.release_meta.outputs.release_name }}
          replacesArtifacts: true
          removeArtifacts: true
          tag: ${{ steps.release_meta.outputs.release_tag }}
